<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 30px;
        }

        .register-box {
            width: 550px;
            background: #fff;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
        }

        .register-box h2 {
            text-align: center;
            font-size: 36px;
            color: #222;
            margin-bottom: 10px;
        }

        .register-box h2 span {
            color: #ffb800;
        }

        .register-box > p {
            text-align: center;
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            height: 55px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            padding: 0 50px;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #ffb800;
            box-shadow: 0 0 0 3px rgba(255,184,0,0.12);
        }

        .left-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            color: #ffb800;
        }

        .show-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            color: #777;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 10px;
            background: #ffb800;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #e5a600;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #ffb800;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .register-box {
                width: 100%;
                padding: 35px 25px;
            }

            .register-box h2 {
                font-size: 30px;
            }

            .input-box input {
                height: 52px;
            }

            .register-btn {
                height: 52px;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>
            Register <span>Me</span>
        </h2>

        <p>
            Create your new account
        </p>

        <form id="registerForm">

            <!-- NAME -->
            <div class="input-box">
                <i class='bx bx-user left-icon'></i>

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >
            </div>

            <!-- USERNAME -->
            <div class="input-box">
                <i class='bx bx-user-circle left-icon'></i>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>

            <!-- EMAIL -->
            <div class="input-box">
                <i class='bx bx-envelope left-icon'></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <i class='bx bx-lock-alt left-icon'></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <i
                    class='bx bx-show show-password'
                    id="showPassword">
                </i>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-box">
                <i class='bx bx-lock left-icon'></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <i
                    class='bx bx-show show-password'
                    id="showConfirmPassword">
                </i>
            </div>

            <button
                type="submit"
                class="register-btn">
                Create Account
            </button>

            <div
                class="message"
                id="message">
            </div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </div>

    </div>


    <script>

        /* =========================
           SHOW PASSWORD
        ========================= */

        function passwordToggle(inputId, iconId) {

            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            icon.addEventListener("click", function () {

                if (input.type === "password") {

                    input.type = "text";

                    icon.classList.remove("bx-show");
                    icon.classList.add("bx-hide");

                } else {

                    input.type = "password";

                    icon.classList.remove("bx-hide");
                    icon.classList.add("bx-show");

                }

            });
        }

        passwordToggle("password", "showPassword");
        passwordToggle("confirmPassword", "showConfirmPassword");


        /* =========================
           REGISTER
        ========================= */

        document
        .getElementById("registerForm")
        .addEventListener("submit", function(e) {

            e.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            /* PASSWORD CHECK */

            if (password !== confirmPassword) {

                message.innerHTML =
                    "Passwords do not match";

                message.style.color = "red";
                message.style.display = "block";

                return;
            }


            /* SUCCESS */

            message.innerHTML =
                "Registration successful ✓";

            message.style.color = "green";
            message.style.display = "block";


            /*
                After 1 second,
                open Login page
            */

            setTimeout(function() {

                window.location.href = "index.html";

            }, 1000);

        });

    </script>

</body>
</html>
