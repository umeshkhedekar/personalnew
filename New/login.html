<!-- =========================
         LOGIN BOX
    ========================= -->

    <section class="logi" id="logi">
        <div class="login-box">

        <h2>
            Login <span>Me</span>
        </h2>

        <p>
            Enter your username and password
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="input-boxx">

                <i class='bx bx-user left-icon'></i>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-boxx">

                <i class='bx bx-lock-alt left-icon'></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <i
                    class='bx bx-show show-password'
                    id="showPassword">
                </i>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <!-- ERROR MESSAGE -->

            <div
                class="message"
                id="message">
            </div>


        </form>


        <!-- REGISTER -->

        <div class="register">

            Don't have an account?

            <a href="#">
                Register
            </a>

        </div>


    </div>
    </section>
<script>




        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        const passwordInput =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");


        showPassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                showPassword.classList.remove("bx-show");

                showPassword.classList.add("bx-hide");

            } else {

                passwordInput.type = "password";

                showPassword.classList.remove("bx-hide");

                showPassword.classList.add("bx-show");

            }

        });
     
      

        /* =========================
           LOGIN
        ========================= */

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            /* =========================
               CHANGE LOGIN DETAILS HERE
            ========================= */

            const correctUsername = "umesh";

            const correctPassword = "12345";


            /* =========================
               CORRECT LOGIN
            ========================= */

            if (
                username === correctUsername &&
                password === correctPassword
            ) {

                /*
                   Correct username/password
                   Open next HTML page
                */

                window.location.href = "home.html";

            }


            /* =========================
               WRONG LOGIN
            ========================= */

            else {

                message.innerHTML =
                    "Wrong username or password";

                message.style.color = "red";

                message.style.display = "block";

            }

        });

    
    </script>
